name: deploy

on:
  push:
    branches: [main]
  pull_request:

# 同じブランチで走っているものがあれば古いほうを止める（デプロイの追い越しを防ぐ）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 既定は6時間。wrangler が入力待ちで止まると気づかないまま枠を食うので短く切る
    timeout-minutes: 10
    env:
      # npm ci の postinstall でも wrangler が走る。ここに置かないと素通りする
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # node_modules を丸ごとキャッシュして npm ci を飛ばす。
      # ~/.npm（setup-node の cache: npm）が持つのは tarball 置き場で、
      # そこから 300MB 超を展開し直すのに毎回7分かかっていた。
      # 依存が変わればキーが変わるので、そのときだけ npm ci に戻る
      - uses: actions/cache@v4
        id: deps
        with:
          path: node_modules
          key: node_modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        if: steps.deps.outputs.cache-hit != 'true'
      - run: npm run check
      - run: npm test

      # ここから先は main への push のときだけ
      - name: D1 マイグレーションを本番に適用
        if: github.event_name == 'push'
        run: npx wrangler d1 migrations apply bento --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Worker をデプロイ
        if: github.event_name == 'push'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
